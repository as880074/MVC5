<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .hello-container {
            background-color: white;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
        }
        .hello-container h1 {
            color: #333;
            font-size: 3em;
            margin-bottom: 20px;
            font-weight: 300;
        }
        .hello-container p {
            color: #666;
            font-size: 1.2em;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div class="hello-container">
        <h1>Hello World</h1>
        <p>歡迎來到 Hello World 頁面！</p>
        <p>Welcome to the Hello World page!</p>
    </div>
</body>
</html>
